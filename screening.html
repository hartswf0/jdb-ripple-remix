<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RIPPLES // Screening</title>
  
  <!-- Import map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    /* THE SACRED PALETTE & MINIMALIST EPISTEMOLOGY 
      Ground work in Cream (#F0EEE6) and Rubin-Slate (#333333).
      Treat the code as the map and the pattern as the territory.
    */
    :root {
      --bg: #F0EEE6;
      --fg: #333333;
      --fg-muted: rgba(51, 51, 51, 0.5);
      --fg-faint: rgba(51, 51, 51, 0.15);
      --accent: rgba(51, 51, 51, 0.08);
      --alert: #a84242;
      --success: #427c59;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 32px;
      --space-xl: 64px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* THE TACTILE VOID (Three.js Canvas) */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    /* THE UNCARVED BLOCK (Structure) */
    .shell {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      border-bottom: 1px solid var(--fg-faint);
      padding-bottom: var(--space-md);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: normal;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .status {
      font-size: 0.85rem;
      color: var(--fg-muted);
    }
    .status.error { color: var(--alert); }

    /* CONTROLS - EFFORTLESS FLOW */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      align-items: center;
    }

    input, select, button {
      appearance: none;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--fg);
      font-family: inherit;
      font-size: 0.85rem;
      padding: var(--space-sm) 0;
      cursor: pointer;
      border-bottom: 1px solid var(--fg-faint);
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    input:focus, select:focus, button:focus {
      outline: none;
      border-bottom-color: var(--fg);
    }

    input { flex: 1; min-width: 200px; }
    input::placeholder { color: var(--fg-muted); }
    
    button {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--fg-faint);
    }
    button:hover {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: var(--space-xl);
      align-items: start;
    }

    /* ASSET LIST */
    .list {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      padding-right: var(--space-md);
    }
    .list::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .asset-btn {
      border: none;
      border-bottom: 1px solid transparent;
      padding: var(--space-md) 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .asset-btn:hover {
      opacity: 1;
    }

    .asset-btn.active {
      opacity: 1;
      border-bottom-color: var(--fg);
      padding-left: var(--space-sm);
    }

    .asset-title {
      font-size: 0.95rem;
      font-weight: bold;
      line-height: 1.2;
    }

    .asset-meta-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 0.75rem;
      color: var(--fg-muted);
      text-transform: uppercase;
    }

    .indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--alert);
    }
    .indicator.good { background: var(--success); }

    /* DETAILS PANEL */
    .detail {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .detail-head {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .detail-title {
      font-size: 1.5rem;
      margin: 0;
      line-height: 1.1;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--space-sm);
      font-size: 0.8rem;
      color: var(--fg-muted);
      border-top: 1px solid var(--fg-faint);
      padding-top: var(--space-sm);
    }

    .meta-grid strong {
      color: var(--fg);
      font-weight: normal;
      display: block;
      margin-bottom: 2px;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    video {
      width: 100%;
      background: var(--fg);
      aspect-ratio: 16/9;
      object-fit: contain;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    
    .actions a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--fg-faint);
      color: var(--fg);
      transition: all 0.3s ease;
    }
    .actions a:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .transcript-wrap {
      margin-top: var(--space-md);
    }

    .tab-row {
      display: flex;
      gap: var(--space-sm);
      border-bottom: 1px solid var(--fg-faint);
      margin-bottom: var(--space-md);
    }

    .tab-row button {
      border: none;
      border-bottom: 2px solid transparent;
      padding: var(--space-sm) var(--space-md);
      opacity: 0.5;
    }
    .tab-row button.active {
      opacity: 1;
      border-bottom-color: var(--fg);
    }

    .rendered, .raw {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--fg);
    }

    .rendered h1, .rendered h2, .rendered h3 {
      font-weight: normal;
      text-transform: uppercase;
      margin-top: 2em;
      margin-bottom: 0.5em;
    }

    .rendered p, .rendered li {
      margin-bottom: 1em;
      color: rgba(51, 51, 51, 0.85);
    }

    .rendered ul { padding-left: 1.5em; }

    pre.raw {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--accent);
      padding: var(--space-md);
    }

    .empty {
      color: var(--fg-muted);
      font-style: italic;
    }

    /* MOBILE: THE TACTILE VOID */
    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        gap: var(--space-xl);
      }
      .shell { padding: var(--space-md); }
      .list {
        max-height: 40vh;
        border-bottom: 1px solid var(--fg-faint);
        padding-bottom: var(--space-md);
      }
      input { width: 100%; }
      video { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <!-- Semantic Memory: Background Visualization -->
  <div id="webgl-container" aria-hidden="true"></div>

  <!-- The Uncarved Block: Minimal Structure -->
  <main class="shell">
    <header>
      <div class="title-row">
        <h1>RIPPLES</h1>
        <a href="index.html" style="color:var(--fg); text-decoration:none; font-size: 0.85rem;">[ Launch ]</a>
      </div>
      <div id="status" class="status">Awakening the library...</div>
      
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Search essence...">
        <select id="buildFilter">
          <option value="all">All Iterations</option>
        </select>
        <select id="sortFilter">
          <option value="date_desc">Newest First</option>
          <option value="date_asc">Oldest First</option>
          <option value="title_asc">Title A-Z</option>
          <option value="title_desc">Title Z-A</option>
        </select>
        <button id="reloadBtn">Refresh</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="list" id="assetList"></aside>

      <article class="detail" id="detailPanel">
        <div class="detail-head">
          <h2 class="detail-title" id="detailTitle">Awaiting Selection</h2>
          <div class="meta-grid" id="detailMeta"></div>
        </div>
        
        <video id="player" controls playsinline preload="metadata"></video>
        
        <div class="actions">
          <a id="openVideoLink" href="#" target="_blank" rel="noopener">Raw Video</a>
          <a id="openTranscriptLink" href="#" target="_blank" rel="noopener">Raw Transcript</a>
          <button id="copyNameBtn">Copy Name</button>
          <button id="fullscreenBtn">Fullscreen</button>
        </div>

        <div class="transcript-wrap" id="transcriptPanel">
          <div class="tab-row">
            <button id="tabRendered" class="active">Rendered</button>
            <button id="tabRaw">Source</button>
          </div>
          <div id="renderedView" class="rendered">
            <div class="empty">The void is empty.</div>
          </div>
          <pre id="rawView" class="raw" style="display:none;"></pre>
        </div>
      </article>
    </section>
  </main>

  <!-- Application Logic -->
  <script type="module">
    import * as THREE from 'three';

    /* --- WU WEI FLOW: Three.js Particle Background --- */
    function initTactileVoid() {
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Semantic Memory: Particles representing data points
      const geometry = new THREE.BufferGeometry();
      const particleCount = 600;
      const positions = new Float32Array(particleCount * 3);
      const phases = new Float32Array(particleCount);

      for(let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 10;
        positions[i*3+1] = (Math.random() - 0.5) * 10;
        positions[i*3+2] = (Math.random() - 0.5) * 5 - 5;
        phases[i] = Math.random() * Math.PI * 2;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

      // Custom shader for organic fading and breathing
      const material = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 },
          color: { value: new THREE.Color('#333333') }
        },
        vertexShader: `
          uniform float time;
          attribute float phase;
          varying float vAlpha;
          void main() {
            vec3 pos = position;
            // Breathe smoothly (Wu Wei)
            pos.y += sin(time * 0.5 + phase) * 0.2;
            pos.x += cos(time * 0.3 + phase) * 0.1;
            
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (8.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
            
            // Depth fading
            vAlpha = smoothstep(10.0, 0.0, -mvPosition.z) * 0.3;
          }
        `,
        fragmentShader: `
          uniform vec3 color;
          varying float vAlpha;
          void main() {
            // Soft circular particles
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = (0.5 - dist) * 2.0 * vAlpha;
            gl_FragColor = vec4(color, alpha);
          }
        `,
        transparent: true,
        depthWrite: false
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);
      camera.position.z = 2;

      // Tactile interaction
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
      });
      document.addEventListener('touchmove', (e) => {
        if(e.touches.length > 0) {
          mouseX = (e.touches[0].clientX - window.innerWidth / 2) * 0.001;
          mouseY = (e.touches[0].clientY - window.innerHeight / 2) * 0.001;
        }
      }, {passive: true});

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        material.uniforms.time.value = time;

        // Lerp camera for fluid response
        targetX = mouseX * 0.5;
        targetY = mouseY * 0.5;
        camera.position.x += (targetX - camera.position.x) * 0.05;
        camera.position.y += (-targetY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    /* --- THE LOGIC LAYER --- */
    const MANIFEST_PATH = "VIDEO UP/video_manifest.json";
    const ASSET_DIR = "VIDEO UP";

    const state = {
      assets: [],
      filtered: [],
      selectedAssetId: null,
      query: "",
      build: "all",
      sort: "date_desc",
      transcriptCache: new Map(),
      tab: "rendered"
    };

    const DOM = {
      status: document.getElementById("status"),
      assetList: document.getElementById("assetList"),
      detailTitle: document.getElementById("detailTitle"),
      detailMeta: document.getElementById("detailMeta"),
      player: document.getElementById("player"),
      openVideo: document.getElementById("openVideoLink"),
      openTranscript: document.getElementById("openTranscriptLink"),
      renderedView: document.getElementById("renderedView"),
      rawView: document.getElementById("rawView"),
      searchInput: document.getElementById("searchInput"),
      buildFilter: document.getElementById("buildFilter"),
      sortFilter: document.getElementById("sortFilter"),
      reloadBtn: document.getElementById("reloadBtn"),
      copyName: document.getElementById("copyNameBtn"),
      fullscreen: document.getElementById("fullscreenBtn"),
      tabRendered: document.getElementById("tabRendered"),
      tabRaw: document.getElementById("tabRaw"),
      detailPanel: document.getElementById("detailPanel")
    };

    const isMobile = () => window.innerWidth <= 900;

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function toAssetUrl(fileName) {
      return `${ASSET_DIR}/${encodeURIComponent(fileName)}`;
    }

    function setStatus(msg, err = false) {
      DOM.status.textContent = msg;
      DOM.status.className = err ? "status error" : "status";
    }

    function setTab(tab) {
      state.tab = tab;
      const r = tab === "rendered";
      DOM.renderedView.style.display = r ? "block" : "none";
      DOM.rawView.style.display = r ? "none" : "block";
      DOM.tabRendered.className = r ? "active" : "";
      DOM.tabRaw.className = !r ? "active" : "";
    }

    function normalizeAsset(raw) {
      return {
        asset_id: raw.asset_id || "",
        pair_code: raw.pair_code || "",
        title: raw.title || "Untitled",
        build: raw.build || "unknown",
        transcript_file: raw.transcript_file || "",
        video_file: raw.video_file || "",
        recommended_base_name: raw.recommended_base_name || "",
        video_exists: Boolean(raw.video_exists),
        exported_at: raw.exported_at || "",
        first_prompt_source: raw.first_prompt_source || "-"
      };
    }

    function formatExportedDate(value) {
      const stamp = Date.parse(value || "");
      if (!stamp) return "Unknown";
      return new Date(stamp).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "2-digit"
      });
    }

    function sortAssets(assets, mode) {
      return [...assets].sort((a, b) => {
        const dateA = Date.parse(a.exported_at || "") || 0;
        const dateB = Date.parse(b.exported_at || "") || 0;
        const tA = (a.title || "").toLowerCase();
        const tB = (b.title || "").toLowerCase();

        if (mode === "date_asc") return dateA - dateB;
        if (mode === "title_asc") return tA.localeCompare(tB);
        if (mode === "title_desc") return tB.localeCompare(tA);
        return dateB - dateA; // date_desc default
      });
    }

    function applyFilters() {
      const q = state.query.toLowerCase();
      const b = state.build;
      const matches = state.assets.filter(a => {
        if (b !== "all" && a.build !== b) return false;
        if (!q) return true;
        const hay = `${a.title} ${a.build} ${a.pair_code} ${a.transcript_file}`.toLowerCase();
        return hay.includes(q);
      });
      state.filtered = sortAssets(matches, state.sort);
      renderAssetList();
      
      if (!state.filtered.find(a => a.asset_id === state.selectedAssetId)) {
        if (state.filtered.length) selectAsset(state.filtered[0].asset_id, false);
        else clearDetail();
      }
    }

    function renderAssetList() {
      if (!state.filtered.length) {
        DOM.assetList.innerHTML = `<div class="empty">No alignments found.</div>`;
        return;
      }
      DOM.assetList.innerHTML = state.filtered.map(a => `
        <button class="asset-btn ${a.asset_id === state.selectedAssetId ? "active" : ""}" data-id="${escapeHtml(a.asset_id)}">
          <span class="asset-title">${escapeHtml(a.title)}</span>
          <span class="asset-meta-row">
            <span class="indicator ${a.video_exists ? 'good' : ''}"></span>
            ${escapeHtml(a.build)} // ${escapeHtml(formatExportedDate(a.exported_at))}
          </span>
        </button>
      `).join("");
      
      DOM.assetList.querySelectorAll(".asset-btn").forEach(btn => {
        btn.addEventListener("click", () => selectAsset(btn.dataset.id, true));
      });
    }

    function clearDetail() {
      DOM.detailTitle.textContent = "Awaiting Selection";
      DOM.detailMeta.innerHTML = "";
      DOM.renderedView.innerHTML = `<div class="empty">The void is empty.</div>`;
      DOM.rawView.textContent = "";
      DOM.player.removeAttribute("src");
      DOM.player.load();
    }

    async function selectAsset(id, userInitiated = false) {
      state.selectedAssetId = id;
      const asset = state.assets.find(a => a.asset_id === id);
      renderAssetList();
      
      if (!asset) return clearDetail();

      DOM.detailTitle.textContent = asset.title;
      DOM.detailMeta.innerHTML = `
        <div><strong>Pair Code</strong> ${escapeHtml(asset.pair_code)}</div>
        <div><strong>Iteration</strong> ${escapeHtml(asset.build)}</div>
        <div><strong>Generated</strong> ${escapeHtml(formatExportedDate(asset.exported_at))}</div>
        <div><strong>Source</strong> ${escapeHtml(asset.first_prompt_source)}</div>
        <div><strong>Status</strong> ${asset.video_exists ? 'Paired' : 'Missing'}</div>
      `;

      const vUrl = toAssetUrl(asset.video_file);
      DOM.player.src = vUrl;
      DOM.openVideo.href = vUrl;
      DOM.openTranscript.href = toAssetUrl(asset.transcript_file);

      await renderTranscript(asset);

      if (userInitiated && isMobile()) {
        DOM.detailPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function parseMarkdown(md) {
      const lines = String(md || "").split("\n");
      const out = [];
      let inList = false;

      const close = () => { if(inList) { out.push("</ul>"); inList = false; } };

      for (const line of lines) {
        const t = line.trimRight();
        if (t.startsWith("### ")) { close(); out.push(`<h3>${escapeHtml(t.slice(4))}</h3>`); }
        else if (t.startsWith("## ")) { close(); out.push(`<h2>${escapeHtml(t.slice(3))}</h2>`); }
        else if (t.startsWith("# ")) { close(); out.push(`<h1>${escapeHtml(t.slice(2))}</h1>`); }
        else if (t.startsWith("- ")) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${escapeHtml(t.slice(2))}</li>`);
        }
        else if (!t.trim()) { close(); }
        else { close(); out.push(`<p>${escapeHtml(t)}</p>`); }
      }
      close();
      return out.join("");
    }

    async function renderTranscript(asset) {
      const key = asset.transcript_file;
      if (state.transcriptCache.has(key)) {
        const text = state.transcriptCache.get(key);
        DOM.renderedView.innerHTML = parseMarkdown(text);
        DOM.rawView.textContent = text;
        return;
      }
      
      DOM.renderedView.innerHTML = `<div class="empty">Summoning...</div>`;
      DOM.rawView.textContent = "Summoning...";
      
      try {
        const res = await fetch(toAssetUrl(key), { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const text = await res.text();
        state.transcriptCache.set(key, text);
        DOM.renderedView.innerHTML = parseMarkdown(text);
        DOM.rawView.textContent = text;
      } catch (e) {
        DOM.renderedView.innerHTML = `<div class="status error">Failed to parse: ${e.message}</div>`;
        DOM.rawView.textContent = `Error: ${e.message}`;
      }
    }

    async function loadManifest() {
      setStatus("Mapping the territory...");
      try {
        const res = await fetch(MANIFEST_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const raw = await res.json();
        state.assets = raw.map(normalizeAsset);
        
        // Populate Builds
        const builds = [...new Set(state.assets.map(a => a.build))].sort();
        DOM.buildFilter.innerHTML = `<option value="all">All Iterations</option>` +
          builds.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");
        
        applyFilters();
        setStatus(`Synchronized ${state.assets.length} artifacts.`);
      } catch (e) {
        state.assets = [];
        applyFilters();
        setStatus(`Silence. Cannot read manifest. (${e.message})`, true);
      }
    }

    // Event Listeners
    DOM.searchInput.addEventListener("input", (e) => { state.query = e.target.value; applyFilters(); });
    DOM.buildFilter.addEventListener("change", (e) => { state.build = e.target.value; applyFilters(); });
    DOM.sortFilter.addEventListener("change", (e) => { state.sort = e.target.value; applyFilters(); });
    DOM.reloadBtn.addEventListener("click", loadManifest);
    DOM.tabRendered.addEventListener("click", () => setTab("rendered"));
    DOM.tabRaw.addEventListener("click", () => setTab("raw"));

    DOM.copyName.addEventListener("click", async () => {
      const a = state.assets.find(x => x.asset_id === state.selectedAssetId);
      if (a && a.recommended_base_name) {
        await navigator.clipboard.writeText(a.recommended_base_name).catch(()=>{});
        setStatus(`Copied: ${a.recommended_base_name}`);
      }
    });

    DOM.fullscreen.addEventListener("click", () => {
      if (DOM.player.requestFullscreen) DOM.player.requestFullscreen();
      else if (DOM.player.webkitEnterFullscreen) DOM.player.webkitEnterFullscreen();
    });

    // Boot Sequence
    initTactileVoid();
    setTab("rendered");
    loadManifest();

  </script>
</body>
</html>
