<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIPPLES // Screening Library</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' fill='%23f0eee6'/%3E%3Ccircle cx='48' cy='48' r='10' fill='%23333333'/%3E%3Ccircle cx='48' cy='48' r='22' fill='none' stroke='%23333333' stroke-width='4' opacity='0.85'/%3E%3Ccircle cx='48' cy='48' r='34' fill='none' stroke='%23333333' stroke-width='3' opacity='0.55'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f0eee6;
      --bg-soft: #f8f6ef;
      --panel: #fcfaf4;
      --line: #d8d2c2;
      --line-strong: #b9b29d;
      --text: #333333;
      --muted: #64635d;
      --accent: #333333;
      --good: #2f8c62;
      --danger: #9b3b3b;
      --shadow: 0 8px 28px rgba(51, 51, 51, 0.08);
      --radius: 12px;
      --scroll-track: #ebe6da;
      --scroll-thumb: #b4ab95;
      --scroll-thumb-hover: #8f8774;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: var(--scroll-track);
    }

    *::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 999px;
      border: 2px solid var(--scroll-track);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-soft), var(--bg));
      color: var(--text);
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    .app {
      max-width: 1360px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .topbar,
    .controls,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .topbar {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1rem, 3.8vw, 1.22rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .status {
      width: 100%;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn,
    .input,
    .select {
      min-height: 40px;
      border: 1px solid var(--line);
      background: #fffef9;
      color: var(--text);
      border-radius: 10px;
      font: inherit;
      font-size: 0.76rem;
      letter-spacing: 0.01em;
      padding: 0 10px;
    }

    .btn {
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible,
    .input:focus-visible,
    .select:focus-visible {
      border-color: var(--line-strong);
      outline: none;
    }

    .btn.primary {
      border-color: var(--accent);
      color: var(--accent);
      background: #f6f2e8;
    }

    .btn.ghost {
      background: transparent;
    }

    .controls {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .control-row {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }

    .layout {
      display: grid;
      gap: 10px;
      min-height: 72vh;
      grid-template-columns: 1fr;
    }

    .panel {
      overflow: hidden;
      min-height: 220px;
    }

    .panel-head {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      font-size: 0.69rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #f4f1e8;
    }

    .asset-list {
      max-height: 74vh;
      overflow: auto;
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .asset-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffef9;
      color: inherit;
      text-align: left;
      cursor: pointer;
      padding: 10px;
      display: grid;
      gap: 6px;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .asset-item:hover,
    .asset-item:focus-visible {
      border-color: var(--line-strong);
      outline: none;
      transform: translateY(-1px);
    }

    .asset-item.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(51, 51, 51, 0.18);
    }

    .asset-title {
      font-size: 0.88rem;
      line-height: 1.28;
      font-weight: 600;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .asset-meta {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      line-height: 1.35;
    }

    .pill-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 18px;
      padding: 0 8px;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
    }

    .pill.good {
      border-color: color-mix(in srgb, var(--good) 45%, white);
      color: var(--good);
    }

    .detail {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 72vh;
    }

    .detail-body {
      padding: 10px;
      display: grid;
      gap: 10px;
      min-height: 0;
      align-content: start;
    }

    .meta-grid {
      display: grid;
      gap: 6px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      font-size: 0.74rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .meta-grid b {
      color: var(--text);
      font-weight: 600;
    }

    .prompt-box {
      border: 1px solid var(--line);
      background: #fffef9;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      gap: 6px;
    }

    .prompt-label {
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .prompt-text {
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--text);
    }

    .video-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0c0c0c;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      max-height: 40vh;
      background: #000;
    }

    .actions {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .actions .btn {
      min-height: 38px;
      font-size: 0.73rem;
    }

    .actions .btn.span {
      grid-column: 1 / -1;
    }

    .transcript-shell {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffef9;
      overflow: hidden;
    }

    .transcript-shell summary {
      cursor: pointer;
      list-style: none;
      min-height: 36px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: #f4f1e8;
    }

    .transcript-shell summary::-webkit-details-marker {
      display: none;
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      padding: 8px 10px 0;
    }

    .tab {
      min-height: 28px;
      padding: 0 9px;
      font-size: 0.68rem;
      border-radius: 999px;
    }

    .transcript-body {
      max-height: 50vh;
      overflow: auto;
      padding: 10px;
      border-top: 1px solid var(--line);
    }

    .rendered h1,
    .rendered h2,
    .rendered h3 {
      margin: 0.45em 0 0.35em;
      color: var(--accent);
      font-size: 0.83rem;
      line-height: 1.3;
    }

    .rendered p,
    .rendered li,
    pre.raw {
      margin: 0;
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }

    .rendered p + p {
      margin-top: 0.45em;
    }

    .rendered ul {
      margin: 0.35em 0;
      padding-left: 16px;
      display: grid;
      gap: 4px;
    }

    pre.raw {
      white-space: pre-wrap;
    }

    .empty,
    .error {
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    .mobile-jump {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .mobile-jump .btn {
      min-height: 34px;
      font-size: 0.68rem;
    }

    @media (min-width: 980px) {
      .app {
        padding: 18px;
      }

      .controls {
        grid-template-columns: minmax(280px, 1fr) auto;
      }

      .control-row--search {
        grid-template-columns: minmax(280px, 1fr);
      }

      .control-row--meta {
        grid-template-columns: 210px 210px auto auto;
      }

      .layout {
        grid-template-columns: 360px minmax(0, 1fr);
      }

      .actions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .actions .btn.span {
        grid-column: auto;
      }

      .mobile-jump {
        display: none;
      }

      .meta-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 979px) {
      .asset-list {
        max-height: 34vh;
      }

      .detail {
        min-height: auto;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .actions .btn.span {
        grid-column: 1 / -1;
      }

      .transcript-body {
        max-height: 42vh;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand">RIPPLES // Screening Library</h1>
      <a class="btn ghost" href="index.html">Back</a>
      <div id="status" class="status">Loading catalog…</div>
    </header>

    <section class="controls" aria-label="Filters">
      <div class="control-row control-row--search">
        <input id="searchInput" class="input" type="search" placeholder="Search title, build, pair, prompt">
      </div>
      <div class="control-row control-row--meta">
        <select id="buildFilter" class="select" aria-label="Filter by build">
          <option value="all">All builds</option>
        </select>
        <select id="sortFilter" class="select" aria-label="Sort">
          <option value="date_desc">Newest</option>
          <option value="date_asc">Oldest</option>
          <option value="title_asc">Title A-Z</option>
          <option value="title_desc">Title Z-A</option>
          <option value="build_asc">Build A-Z</option>
          <option value="build_desc">Build Z-A</option>
        </select>
        <button id="clearBtn" class="btn" type="button">Clear</button>
        <button id="reloadBtn" class="btn" type="button">Reload</button>
      </div>
    </section>

    <nav class="mobile-jump" aria-label="Mobile section navigation">
      <button id="jumpListBtn" class="btn" type="button">List</button>
      <button id="jumpVideoBtn" class="btn" type="button">Video</button>
      <button id="jumpTranscriptBtn" class="btn" type="button">Transcript</button>
    </nav>

    <section class="layout">
      <aside class="panel" id="assetPanel">
        <div class="panel-head">
          <span>Library</span>
          <span id="assetCount">0</span>
        </div>
        <div id="assetList" class="asset-list"></div>
      </aside>

      <section class="panel detail" id="detailPanel">
        <div class="panel-head">
          <span id="detailTitle">No asset selected</span>
          <span id="pairStatus">-</span>
        </div>
        <div class="detail-body">
          <div class="meta-grid" id="detailMeta"></div>

          <div class="prompt-box">
            <span class="prompt-label">Prompt Excerpt</span>
            <div id="promptText" class="prompt-text">-</div>
          </div>

          <div class="video-wrap">
            <video id="player" controls playsinline preload="metadata"></video>
          </div>

          <div class="actions">
            <a id="openVideoLink" class="btn primary" href="#" target="_blank" rel="noopener">Open Video</a>
            <a id="openTranscriptLink" class="btn" href="#" target="_blank" rel="noopener">Open Transcript</a>
            <button id="fullscreenBtn" class="btn" type="button">Fullscreen</button>
            <button id="copyTitleBtn" class="btn" type="button">Copy Title</button>
            <button id="copyNameBtn" class="btn span" type="button">Copy Base Name</button>
          </div>

          <details id="transcriptShell" class="transcript-shell" open>
            <summary>Transcript</summary>
            <div class="tabs">
              <button id="tabRendered" class="btn tab" type="button">Rendered</button>
              <button id="tabRaw" class="btn tab" type="button">Raw</button>
            </div>
            <div id="transcriptPanel" class="transcript-body">
              <div id="renderedView" class="rendered"></div>
              <pre id="rawView" class="raw" style="display:none;"></pre>
            </div>
          </details>
        </div>
      </section>
    </section>
  </main>

  <script>
    const MANIFEST_PATH = "VIDEO UP/video_manifest.json";
    const ASSET_DIR = "VIDEO UP";

    const state = {
      assets: [],
      filtered: [],
      selectedAssetId: null,
      query: "",
      build: "all",
      sort: "date_desc",
      tab: "rendered",
      transcriptCache: new Map()
    };

    const statusEl = document.getElementById("status");
    const assetListEl = document.getElementById("assetList");
    const assetCountEl = document.getElementById("assetCount");
    const detailTitleEl = document.getElementById("detailTitle");
    const pairStatusEl = document.getElementById("pairStatus");
    const detailMetaEl = document.getElementById("detailMeta");
    const promptTextEl = document.getElementById("promptText");
    const playerEl = document.getElementById("player");
    const openVideoLinkEl = document.getElementById("openVideoLink");
    const openTranscriptLinkEl = document.getElementById("openTranscriptLink");
    const copyTitleBtnEl = document.getElementById("copyTitleBtn");
    const copyNameBtnEl = document.getElementById("copyNameBtn");
    const fullscreenBtnEl = document.getElementById("fullscreenBtn");

    const renderedViewEl = document.getElementById("renderedView");
    const rawViewEl = document.getElementById("rawView");
    const transcriptShellEl = document.getElementById("transcriptShell");

    const searchInputEl = document.getElementById("searchInput");
    const buildFilterEl = document.getElementById("buildFilter");
    const sortFilterEl = document.getElementById("sortFilter");
    const clearBtnEl = document.getElementById("clearBtn");
    const reloadBtnEl = document.getElementById("reloadBtn");

    const tabRenderedEl = document.getElementById("tabRendered");
    const tabRawEl = document.getElementById("tabRaw");

    const jumpListBtnEl = document.getElementById("jumpListBtn");
    const jumpVideoBtnEl = document.getElementById("jumpVideoBtn");
    const jumpTranscriptBtnEl = document.getElementById("jumpTranscriptBtn");

    const assetPanelEl = document.getElementById("assetPanel");
    const detailPanelEl = document.getElementById("detailPanel");
    const transcriptPanelEl = document.getElementById("transcriptPanel");

    const isMobileQuery = window.matchMedia("(max-width: 979px)");

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function toAssetUrl(fileName) {
      return `${ASSET_DIR}/${encodeURIComponent(fileName)}`;
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function setTab(tab) {
      state.tab = tab;
      const renderedActive = tab === "rendered";
      renderedViewEl.style.display = renderedActive ? "block" : "none";
      rawViewEl.style.display = renderedActive ? "none" : "block";
      tabRenderedEl.style.borderColor = renderedActive ? "var(--line-strong)" : "var(--line)";
      tabRawEl.style.borderColor = renderedActive ? "var(--line)" : "var(--line-strong)";
    }

    function buildOptions(assets) {
      const builds = [...new Set(assets.map(a => a.build || "unknown"))].sort();
      buildFilterEl.innerHTML = `<option value="all">All builds</option>` +
        builds.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");
    }

    function normalizeAsset(raw) {
      return {
        asset_id: raw.asset_id || "",
        pair_code: raw.pair_code || "",
        title: raw.title || "Untitled",
        build: raw.build || "unknown",
        transcript_file: raw.transcript_file || "",
        video_file: raw.video_file || "",
        first_prompt_excerpt: raw.first_prompt_excerpt || "",
        first_prompt_source: raw.first_prompt_source || "",
        recommended_base_name: raw.recommended_base_name || "",
        video_exists: Boolean(raw.video_exists),
        exported_at: raw.exported_at || "",
        session_id: raw.session_id || ""
      };
    }

    function sortAssets(assets, mode) {
      const list = [...assets];
      list.sort((a, b) => {
        const dateA = Date.parse(a.exported_at || "") || 0;
        const dateB = Date.parse(b.exported_at || "") || 0;
        const titleA = String(a.title || "").toLowerCase();
        const titleB = String(b.title || "").toLowerCase();
        const buildA = String(a.build || "").toLowerCase();
        const buildB = String(b.build || "").toLowerCase();

        if (mode === "date_asc") return dateA - dateB;
        if (mode === "title_asc") return titleA.localeCompare(titleB);
        if (mode === "title_desc") return titleB.localeCompare(titleA);
        if (mode === "build_asc") return buildA.localeCompare(buildB) || titleA.localeCompare(titleB);
        if (mode === "build_desc") return buildB.localeCompare(buildA) || titleA.localeCompare(titleB);
        return dateB - dateA;
      });
      return list;
    }

    function formatExportedDate(value) {
      const stamp = Date.parse(value || "");
      if (!stamp) return "Unknown date";
      return new Date(stamp).toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      const b = state.build;

      const matches = state.assets.filter(asset => {
        if (b !== "all" && asset.build !== b) return false;
        if (!q) return true;
        const hay = [
          asset.title,
          asset.build,
          asset.pair_code,
          asset.first_prompt_excerpt,
          asset.transcript_file,
          asset.video_file
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });

      state.filtered = sortAssets(matches, state.sort);
      renderAssetList();
      updateCount();

      if (!state.filtered.some(a => a.asset_id === state.selectedAssetId)) {
        if (state.filtered.length > 0) {
          selectAsset(state.filtered[0].asset_id, { scrollToDetail: false });
        } else {
          clearDetail();
        }
      }
    }

    function updateCount() {
      assetCountEl.textContent = `${state.filtered.length} / ${state.assets.length}`;
    }

    function renderAssetList() {
      if (state.filtered.length === 0) {
        assetListEl.innerHTML = `<div class="empty">No assets match current filters.</div>`;
        return;
      }

      assetListEl.innerHTML = state.filtered.map(asset => `
        <button class="asset-item${asset.asset_id === state.selectedAssetId ? " active" : ""}" data-id="${escapeHtml(asset.asset_id)}">
          <span class="asset-title">${escapeHtml(asset.title)}</span>
          <span class="pill-row">
            <span class="pill${asset.video_exists ? " good" : ""}">${asset.video_exists ? "paired" : "missing"}</span>
            <span class="asset-meta">${escapeHtml(asset.build)}</span>
          </span>
          <span class="asset-meta">${escapeHtml(formatExportedDate(asset.exported_at))}</span>
        </button>
      `).join("");

      assetListEl.querySelectorAll(".asset-item").forEach(btn => {
        btn.addEventListener("click", () => selectAsset(btn.dataset.id));
      });
    }

    function clearDetail() {
      detailTitleEl.textContent = "No asset selected";
      pairStatusEl.textContent = "-";
      pairStatusEl.style.color = "var(--muted)";
      detailMetaEl.innerHTML = "";
      promptTextEl.textContent = "-";
      renderedViewEl.innerHTML = `<div class="empty">Select an asset to preview transcript and play video.</div>`;
      rawViewEl.textContent = "";
      playerEl.removeAttribute("src");
      playerEl.load();
      openVideoLinkEl.href = "#";
      openTranscriptLinkEl.href = "#";
    }

    function findAssetById(id) {
      return state.assets.find(a => a.asset_id === id) || null;
    }

    async function selectAsset(assetId, options = {}) {
      state.selectedAssetId = assetId;
      renderAssetList();

      const asset = findAssetById(assetId);
      if (!asset) return clearDetail();

      detailTitleEl.textContent = asset.title;
      pairStatusEl.textContent = asset.video_exists ? "Paired" : "Missing Video";
      pairStatusEl.style.color = asset.video_exists ? "var(--good)" : "var(--danger)";

      detailMetaEl.innerHTML = `
        <div><b>Build:</b> ${escapeHtml(asset.build)}</div>
        <div><b>Date:</b> ${escapeHtml(formatExportedDate(asset.exported_at))}</div>
        <div><b>Pair:</b> ${escapeHtml(asset.pair_code)}</div>
        <div><b>Session:</b> ${escapeHtml(asset.session_id || "-")}</div>
      `;

      promptTextEl.textContent = asset.first_prompt_excerpt || "(none)";

      const videoUrl = toAssetUrl(asset.video_file);
      const transcriptUrl = toAssetUrl(asset.transcript_file);
      playerEl.src = videoUrl;
      openVideoLinkEl.href = videoUrl;
      openTranscriptLinkEl.href = transcriptUrl;

      await renderTranscript(asset);

      if (isMobileQuery.matches && options.scrollToDetail !== false) {
        detailPanelEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderMarkdownBasic(markdown) {
      const lines = String(markdown || "").replaceAll("\r\n", "\n").split("\n");
      const out = [];
      let inList = false;

      function closeList() {
        if (inList) {
          out.push("</ul>");
          inList = false;
        }
      }

      for (const line of lines) {
        if (line.startsWith("### ")) {
          closeList();
          out.push(`<h3>${escapeHtml(line.slice(4))}</h3>`);
        } else if (line.startsWith("## ")) {
          closeList();
          out.push(`<h2>${escapeHtml(line.slice(3))}</h2>`);
        } else if (line.startsWith("# ")) {
          closeList();
          out.push(`<h1>${escapeHtml(line.slice(2))}</h1>`);
        } else if (line.startsWith("- ")) {
          if (!inList) {
            out.push("<ul>");
            inList = true;
          }
          out.push(`<li>${escapeHtml(line.slice(2))}</li>`);
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          out.push(`<p>${escapeHtml(line)}</p>`);
        }
      }

      closeList();
      return out.join("");
    }

    async function renderTranscript(asset) {
      const key = asset.transcript_file;
      if (state.transcriptCache.has(key)) {
        const cached = state.transcriptCache.get(key);
        renderedViewEl.innerHTML = renderMarkdownBasic(cached);
        rawViewEl.textContent = cached;
        return;
      }

      renderedViewEl.innerHTML = `<div class="empty">Loading transcript…</div>`;
      rawViewEl.textContent = "Loading transcript…";

      try {
        const res = await fetch(toAssetUrl(asset.transcript_file), { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        state.transcriptCache.set(key, text);
        renderedViewEl.innerHTML = renderMarkdownBasic(text);
        rawViewEl.textContent = text;
      } catch (error) {
        renderedViewEl.innerHTML = `<div class="error">Transcript load failed: ${escapeHtml(error.message)}</div>`;
        rawViewEl.textContent = `Transcript load failed: ${error.message}`;
      }
    }

    async function loadManifest() {
      setStatus("Loading catalog…");
      try {
        const res = await fetch(MANIFEST_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        if (!Array.isArray(raw)) throw new Error("Manifest is not an array.");

        state.assets = raw.map(normalizeAsset);
        buildOptions(state.assets);
        applyFilters();

        if (state.filtered.length > 0) {
          await selectAsset(state.filtered[0].asset_id, { scrollToDetail: false });
        } else {
          clearDetail();
        }

        const paired = state.assets.filter(a => a.video_exists).length;
        setStatus(`Loaded ${state.assets.length} assets. Paired videos: ${paired}.`);
      } catch (error) {
        state.assets = [];
        state.filtered = [];
        renderAssetList();
        clearDetail();
        setStatus(`Manifest load failed (${error.message}). Serve over HTTP (example: python3 -m http.server).`, true);
      }
    }

    searchInputEl.addEventListener("input", () => {
      state.query = searchInputEl.value;
      applyFilters();
    });

    buildFilterEl.addEventListener("change", () => {
      state.build = buildFilterEl.value;
      applyFilters();
    });

    sortFilterEl.addEventListener("change", () => {
      state.sort = sortFilterEl.value;
      applyFilters();
    });

    clearBtnEl.addEventListener("click", () => {
      state.query = "";
      state.build = "all";
      state.sort = "date_desc";
      searchInputEl.value = "";
      buildFilterEl.value = "all";
      sortFilterEl.value = "date_desc";
      applyFilters();
    });

    reloadBtnEl.addEventListener("click", loadManifest);

    tabRenderedEl.addEventListener("click", () => setTab("rendered"));
    tabRawEl.addEventListener("click", () => setTab("raw"));

    copyTitleBtnEl.addEventListener("click", async () => {
      const asset = findAssetById(state.selectedAssetId);
      if (!asset) return;
      try {
        await navigator.clipboard.writeText(asset.title || "");
        setStatus(`Copied title: ${asset.title}`);
      } catch {
        setStatus("Clipboard copy failed.", true);
      }
    });

    copyNameBtnEl.addEventListener("click", async () => {
      const asset = findAssetById(state.selectedAssetId);
      if (!asset) return;
      try {
        await navigator.clipboard.writeText(asset.recommended_base_name || "");
        setStatus(`Copied base name: ${asset.recommended_base_name}`);
      } catch {
        setStatus("Clipboard copy failed.", true);
      }
    });

    fullscreenBtnEl.addEventListener("click", async () => {
      if (!playerEl.src) return;
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (playerEl.requestFullscreen) {
          await playerEl.requestFullscreen();
        } else if (playerEl.webkitEnterFullscreen) {
          playerEl.webkitEnterFullscreen();
        }
      } catch {
        setStatus("Fullscreen unavailable on this browser.", true);
      }
    });

    jumpListBtnEl.addEventListener("click", () => {
      assetPanelEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    jumpVideoBtnEl.addEventListener("click", () => {
      detailPanelEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    jumpTranscriptBtnEl.addEventListener("click", () => {
      transcriptPanelEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    document.addEventListener("keydown", (event) => {
      if (event.target && ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (!state.filtered.length) return;

      const idx = state.filtered.findIndex(a => a.asset_id === state.selectedAssetId);
      if (event.key === "ArrowDown") {
        const next = state.filtered[Math.min(state.filtered.length - 1, Math.max(0, idx + 1))];
        if (next) selectAsset(next.asset_id, { scrollToDetail: false });
      } else if (event.key === "ArrowUp") {
        const prev = state.filtered[Math.max(0, idx - 1)];
        if (prev) selectAsset(prev.asset_id, { scrollToDetail: false });
      } else if (event.key === " ") {
        if (playerEl.paused) playerEl.play();
        else playerEl.pause();
        event.preventDefault();
      }
    });

    setTab("rendered");
    if (isMobileQuery.matches) transcriptShellEl.open = false;
    loadManifest();
  </script>
</body>
</html>
